[pytest]
# Test discovery — look for tests in the tests/ folder
testpaths = tests

# Output — show each test name and result (-v), print any stdout (-s)
addopts = -v -s

# Custom markers — lets you run subsets: pytest -m fast
markers =
    fast: Tests that make no LLM calls (retriever, embeddings)
    llm:  Tests that make LLM calls (agents, pipeline)